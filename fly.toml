# fly.toml app configuration file generated for Playza
# See https://fly.io/docs/reference/configuration/

app = 'playza-metaverse'
primary_region = 'nrt'

[build]

# Socket.IO는 메모리 방 상태라 머신 1대만 사용 (--ha=false 로 배포)
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
